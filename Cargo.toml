[package]
name = "gray-input"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Merged input plugin for the gray agent harness: commands, preset, transform, inline-bash in one sidecar."

[[bin]]
name = "input"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
